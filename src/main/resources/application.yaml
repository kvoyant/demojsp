      - { popup-type: TOP_SLIDE, category: EVENT, title: "하루만 맡겨도 이자가 쌓여요", content: "페퍼스 파킹통장4 · 수시입출금", image-url: /images/common/banner/slide-parking.svg, alt-text: "파킹통장 그림", link-url: /product/deposit/PS_PARKING4, background-color: "#FFF4E0", start-day-offset: -2, end-day-offset: 30, display-order: 2 }
      - { popup-type: TOP_SLIDE, category: EVENT, title: "2030을 위한 높은 금리 적금", content: "페퍼스 2030적금 · 매월 자유롭게 저축", image-url: /images/common/banner/slide-savings.svg, alt-text: "쌓여 있는 동전 그림", link-url: /product/deposit/PS_2030, background-color: "#0D47A1", start-day-offset: -1, end-day-offset: 30, display-order: 3 }
      - { popup-type: TOP_SLIDE, category: EVENT, title: "사업자도 담보로 든든하게", content: "페퍼스 사업자담보대출 · 상담 신청", image-url: /images/common/banner/slide-biz.svg, alt-text: "건물 그림", link-url: /product/loan/PS_BIZ_MORTGAGE, background-color: "#E6F4EA", start-day-offset: -1, end-day-offset: 30, display-order: 4 }
      - { popup-type: TOP_SLIDE, category: EVENT, title: "기간 한정 예금 특판", content: "정기예금 금리우대 · 한도 소진 시 종료", image-url: /images/common/banner/slide-deposit.svg, alt-text: "예금 통장 그림", link-url: /product/deposit/SPECIAL, background-color: "#FDECEA", start-day-offset: 0, end-day-offset: 14, display-order: 5 }
      - { popup-type: TOP_SLIDE, category: EVENT, title: "[6번째] 최대 5건 초과 - 미노출", content: "표시순서 6 → 노출 제외", background-color: "#F3F4F6", start-day-offset: 0, end-day-offset: 14, display-order: 6 }
      - { popup-type: TOP_SLIDE, category: EVENT, title: "[게시예정] 연말 이벤트", content: "게시기간 전 - 미노출", background-color: "#FFFFFF", start-day-offset: 5, end-day-offset: 30, display-order: 1 }
    top-slide:
      max-count: 5                # 기능1 최대 5건
      interval-ms: 2000           # 기능2 자동 슬라이딩 2초
      default-background-color: "#E3ECFA"
      demo-customer-param: true   # local 테스트 전용! 운영: false (로그인 세션 고객만)
      account-holders: [customer01]   # local 흉내: 계좌 보유 고객 (운영은 계좌원장 조회 구현체로 교체)
      main-text-max: 20           # 공통#45 상품소개 메인텍스트 글자 수 제한 (수행사 제안값 - 업무 확정 후 조정)
      sub-text-max: 30            # 공통#45 서브텍스트 글자 수 제한
    image-upload:                 # 공통#45 이미지 파일선택 (local 디스크 저장 - 운영은 파일 공통 저장소로 교체)
      dir:                        # 비우면 java.io.tmpdir/demojsp-banner-images
      max-bytes: 2097152          # 2MB
      url-prefix: /common/banner/images/

