<?xml version="1.0" encoding="UTF-8"?>
<!--
  =============================================================================
   [CF-UI-01 / 공통#41] 공통 아이콘 스프라이트  -  /images/common/ui-icons.svg
  -  24 x 24 그리드, 선 굵기 1.75, 둥근 끝 / 색상은 currentColor (글자색을 따라감)
  -  사용: <svg class="ui-icon" aria-hidden="true"><use href="/images/common/ui-icons.svg#ic-loan"></use></svg>
  -  아이콘 추가 시: symbol(id = ic-영문명) + title(한글명) 추가 → ui-icon.js CATALOG 에도 추가
  -     (UiComponentTest 가 CATALOG 와 스프라이트 일치 여부를 검사)
  =============================================================================
-->
